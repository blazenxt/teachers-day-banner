<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Teacher's Day | Celebrations</title>
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold-1: #fff8d0;
      --gold-2: #f5e09a;
      --gold-3: #e8c547;
      --gold-4: #d4af37;
      --gold-5: #c9a227;
      --gold-6: #a07818;
      --gold-7: #6e5210;
      --black: #000000;

      /* One scaling unit = size of 1 "design pixel".
         --u is the LARGEST uniform scale that fits a 1120 x 720 design
         inside the viewport, bounded by BOTH width and height. This makes
         the banner perfectly fit ANY screen / smart board (16:9, 4:3,
         ultrawide, phone portrait or landscape) with no JavaScript and no
         clipping. Pure CSS, so content can never disappear. */
      --u: min(0.0840vw, 0.1300vh);
    }
    /* Use the real (dynamic) viewport on browsers that support it */
    @supports (height: 100dvh) {
      :root { --u: min(0.0840dvw, 0.1300dvh); }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--black);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== STAGE / VIEWPORT ========== */
    .banner {
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, #16100a 0%, #070500 48%, #000 100%);
    }

    /* Soft vignette — kept BELOW the frame/content so it never hides text */
    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 92% 86% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ========== AURORA BLOBS ========== */
    .aurora {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      pointer-events: none;
      z-index: 0;
      /* NOTE: no mix-blend-mode — it forces expensive offscreen compositing
         on low-end GPUs (causes stutter). Plain blurred glow is cheap. */
    }
    .aurora.a1 {
      width: 46vmax; height: 46vmax;
      left: -12vmax; top: -14vmax;
      background: radial-gradient(circle, rgba(212,175,55,0.14), transparent 65%);
      animation: drift-1 22s ease-in-out infinite alternate;
    }
    .aurora.a2 {
      width: 40vmax; height: 40vmax;
      right: -12vmax; bottom: -12vmax;
      background: radial-gradient(circle, rgba(160,120,24,0.16), transparent 65%);
      animation: drift-2 26s ease-in-out infinite alternate;
    }
    .aurora.a3 {
      width: 30vmax; height: 30vmax;
      left: 55%; top: 60%;
      background: radial-gradient(circle, rgba(232,197,71,0.08), transparent 65%);
      animation: drift-3 30s ease-in-out infinite alternate;
    }

    @keyframes drift-1 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(6vmax, 4vmax) scale(1.15); }
    }
    @keyframes drift-2 {
      from { transform: translate(0, 0) scale(1.1); }
      to   { transform: translate(-5vmax, -5vmax) scale(0.95); }
    }
    @keyframes drift-3 {
      from { transform: translate(0, 0); }
      to   { transform: translate(-8vmax, -6vmax); }
    }

    /* Rotating light rays behind content */
    .rays {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 130vmax;
      height: 130vmax;
      transform: translate(-50%, -50%);
      background: conic-gradient(
        from 0deg,
        transparent 0deg, rgba(212,175,55,0.045) 12deg, transparent 24deg,
        transparent 60deg, rgba(212,175,55,0.035) 72deg, transparent 84deg,
        transparent 120deg, rgba(212,175,55,0.045) 132deg, transparent 144deg,
        transparent 180deg, rgba(212,175,55,0.035) 192deg, transparent 204deg,
        transparent 240deg, rgba(212,175,55,0.045) 252deg, transparent 264deg,
        transparent 300deg, rgba(212,175,55,0.035) 312deg, transparent 324deg
      );
      pointer-events: none;
      z-index: 1;
      animation: spin-rays 90s linear infinite;
      opacity: 0.9;
      will-change: transform;
    }
    @keyframes spin-rays {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Ambient gold glow behind content — subtle opacity breathe (cheap),
       blur is static so it doesn't repaint every frame. */
    .glow {
      position: absolute;
      width: min(70vw, 900px);
      height: min(55vh, 520px);
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(212, 175, 55, 0.17) 0%,
        rgba(212, 175, 55, 0.06) 35%,
        transparent 70%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 1;
      animation: pulse-glow 5s ease-in-out infinite;
      will-change: opacity;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    /* ========== SPARKLES ========== */
    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gold-2);
      box-shadow: 0 0 6px 1px rgba(255, 220, 120, 0.85);
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      opacity: 0.3;
    }

    .spark.cross {
      width: 0;
      height: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--gold-3);
      font-size: var(--sz, 12px);
      text-shadow: 0 0 8px rgba(255, 220, 100, 0.9);
      line-height: 1;
    }
    .spark.cross::before { content: "✦"; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Rising golden dust */
    .dust {
      position: absolute;
      bottom: -4vh;
      border-radius: 50%;
      background: var(--gold-2);
      box-shadow: 0 0 8px 2px rgba(255, 220, 120, 0.5);
      opacity: 0;
      animation: rise var(--rd, 14s) linear infinite;
      animation-delay: var(--rdelay, 0s);
      pointer-events: none;
    }
    @keyframes rise {
      0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
      8%   { opacity: var(--rop, 0.7); }
      50%  { transform: translateY(-52vh) translateX(3vw) scale(1); }
      92%  { opacity: var(--rop, 0.7); }
      100% { transform: translateY(-108vh) translateX(-2vw) scale(0.7); opacity: 0; }
    }

    /* ========== FRAME ========== */
    .frame {
      position: absolute;
      inset: clamp(12px, 2.2vh, 26px) clamp(14px, 2.2vw, 34px);
      z-index: 5;
      pointer-events: none;
      animation: fade-in 1.4s ease backwards;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .frame-outer {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgba(201, 162, 39, 0.85);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.8),
        inset 0 0 40px rgba(212, 175, 55, 0.03);
    }

    .frame-inner {
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(212, 175, 55, 0.32);
    }

    .tick {
      position: absolute;
      width: 8px;
      height: 8px;
      background: linear-gradient(135deg, var(--gold-2), var(--gold-5));
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.55);
      z-index: 4;
    }
    .tick.top { top: -4px; left: 50%; margin-left: -4px; }
    .tick.bottom { bottom: -4px; left: 50%; margin-left: -4px; }
    .tick.left { left: -4px; top: 50%; margin-top: -4px; }
    .tick.right { right: -4px; top: 50%; margin-top: -4px; }
    /* Cheap glow pulse — opacity + scale only (no box-shadow repaint) */
    .tick::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,220,120,0.55), transparent 70%);
      animation: tick-halo 3.2s ease-in-out infinite;
      will-change: opacity, transform;
    }
    @keyframes tick-halo {
      0%, 100% { opacity: 0.25; transform: scale(0.7); }
      50%      { opacity: 0.9;  transform: scale(1.25); }
    }

    .corner {
      position: absolute;
      width: clamp(64px, 8vw, 104px);
      height: clamp(64px, 8vw, 104px);
      z-index: 5;
    }
    .corner svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .tl { top: -2px; left: -2px; }
    .tr { top: -2px; right: -2px; transform: scaleX(-1); }
    .bl { bottom: -2px; left: -2px; transform: scaleY(-1); }
    .br { bottom: -2px; right: -2px; transform: scale(-1); }

    /* ========== CONTENT (sized with the --u scaling unit) ========== */
    .stage {
      position: relative;
      z-index: 6;
      display: grid;
      place-items: center;
      width: 100%;
    }

    .content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: calc(1120 * var(--u));
      max-width: 95vw;
      padding: 0 calc(30 * var(--u));
      animation: rise-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    /* Entrance uses opacity + transform only (animating filter:blur
       repaints the whole stack every frame — removed for smoothness). */
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 600;
      font-size: calc(15 * var(--u));
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(232, 197, 71, 0.85);
      margin-bottom: calc(20 * var(--u));
      display: flex;
      align-items: center;
      gap: calc(16 * var(--u));
      white-space: nowrap;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: calc(52 * var(--u));
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-5));
    }
    .eyebrow::after {
      background: linear-gradient(90deg, var(--gold-5), transparent);
    }

    .laurel {
      width: calc(112 * var(--u));
      height: auto;
      margin-bottom: calc(14 * var(--u));
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.45));
      animation: float-soft 6s ease-in-out infinite;
      will-change: transform;
      /* glow kept static — animating drop-shadow filter repaints each frame */
    }

    @keyframes float-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(calc(-5 * var(--u))); }
    }

    h1 {
      font-family: 'Cinzel', 'Times New Roman', Georgia, serif;
      font-weight: 900;
      font-size: calc(64 * var(--u));
      letter-spacing: 0.085em;
      line-height: 1.05;
      text-transform: uppercase;
      margin: 0;
      white-space: nowrap;
      background: linear-gradient(
        175deg,
        #fffef5 0%,
        #fff8d0 8%,
        #f5e09a 22%,
        #e8c547 40%,
        #d4af37 55%,
        #a07818 78%,
        #d4af37 92%,
        #f0d78c 100%
      );
      background-size: 100% 220%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 2px 0 rgba(60, 40, 0, 0.55))
        drop-shadow(0 0 28px rgba(212, 175, 55, 0.35));
      /* gold gradient is static — animating background-position on a
         gradient-clipped text node repaints the glyphs every frame */
    }

    .script {
      font-family: 'Great Vibes', 'Segoe Script', cursive;
      font-size: calc(54 * var(--u));
      font-weight: 400;
      line-height: 1.1;
      margin-top: calc(8 * var(--u));
      background: linear-gradient(180deg, #fff3c4 0%, #e8c547 48%, #b8922a 100%);
      background-size: 100% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.3));
      letter-spacing: 0.03em;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(12 * var(--u));
      width: calc(300 * var(--u));
      margin: calc(22 * var(--u)) 0;
    }
    .divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-5) 20%, var(--gold-3) 50%, var(--gold-5) 80%, transparent);
    }
    .divider .jewel {
      position: relative;
      width: calc(11 * var(--u));
      height: calc(11 * var(--u));
      flex-shrink: 0;
      animation: jewel-spin 5s linear infinite;
      will-change: transform;
    }
    .divider .jewel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold-1), var(--gold-5));
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.75);
    }
    .divider .jewel::after {
      content: "";
      position: absolute;
      inset: calc(3 * var(--u));
      background: #1a1408;
      transform: rotate(45deg);
    }
    @keyframes jewel-spin {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50%      { transform: rotate(180deg) scale(1.15); }
    }

    .lines {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: calc(25 * var(--u));
      letter-spacing: 0.06em;
      line-height: 1.5;
      color: #f0d78c;
      text-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
      white-space: nowrap;
    }
    .lines .primary {
      display: block;
      font-weight: 600;
      font-size: 1.08em;
      color: #f7e3a0;
      letter-spacing: 0.08em;
    }
    .lines .secondary {
      display: block;
      font-style: italic;
      opacity: 0.92;
      font-size: 0.95em;
      letter-spacing: 0.05em;
      color: #d4b85a;
    }

    .icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(64 * var(--u));
      margin: calc(26 * var(--u)) 0;
    }

    .icon-wrap {
      position: relative;
      width: calc(74 * var(--u));
      height: calc(74 * var(--u));
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%,
        rgba(212, 175, 55, 0.12) 0%,
        rgba(212, 175, 55, 0.03) 55%,
        transparent 70%);
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.22),
        0 0 20px rgba(212, 175, 55, 0.1);
      animation: icon-in 0.9s ease backwards;
    }
    .icon-wrap:nth-child(1) { animation-delay: 0.45s; }
    .icon-wrap:nth-child(2) { animation-delay: 0.6s; }
    .icon-wrap:nth-child(3) { animation-delay: 0.75s; }

    .icon-wrap::before {
      content: "";
      position: absolute;
      inset: calc(-9 * var(--u));
      border-radius: 50%;
      border: calc(1.6 * var(--u)) dashed rgba(212, 175, 55, 0.35);
      animation: halo-spin 14s linear infinite;
      will-change: transform;
    }
    .icon-wrap::after {
      content: "";
      position: absolute;
      inset: calc(-16 * var(--u));
      border-radius: 50%;
      border: calc(1.6 * var(--u)) solid rgba(232, 197, 71, 0.1);
    }

    @keyframes halo-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes icon-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap svg {
      width: 58%;
      height: 58%;
      stroke: url(#iconStroke);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.4));
      position: relative;
      z-index: 1;
    }
    .icon-wrap svg .fg {
      fill: url(#iconFill);
      stroke: none;
    }

    .date-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: calc(20 * var(--u));
      padding: calc(12 * var(--u)) calc(36 * var(--u));
      border: calc(1.6 * var(--u)) solid rgba(201, 162, 39, 0.45);
      border-radius: 999px;
      background: linear-gradient(180deg,
        rgba(212, 175, 55, 0.12) 0%,
        rgba(12, 9, 3, 0.6) 100%);
      box-shadow:
        0 0 24px rgba(212, 175, 55, 0.12),
        inset 0 1px 0 rgba(255, 240, 180, 0.12);
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 700;
      font-size: calc(23 * var(--u));
      letter-spacing: 0.18em;
      color: #f0d78c;
      text-shadow: 0 0 14px rgba(212, 175, 55, 0.4);
      margin-top: calc(10 * var(--u));
      white-space: nowrap;
    }
    /* Breathing glow — opacity + scale pseudo halo (cheap, GPU-composited) */
    .date-badge::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(212,175,55,0.22), transparent 70%);
      z-index: -1;
      animation: badge-halo 3.4s ease-in-out infinite;
      will-change: opacity, transform;
    }
    @keyframes badge-halo {
      0%, 100% { opacity: 0.45; transform: scale(0.96); }
      50%      { opacity: 1;    transform: scale(1.06); }
    }
    .date-badge .spark {
      position: static;
      width: auto;
      height: auto;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      animation: none;
      opacity: 1;
      font-size: 0.7em;
      color: var(--gold-3);
      text-shadow: 0 0 8px rgba(255, 220, 120, 0.85);
    }

    .bottom-mark {
      margin-top: calc(22 * var(--u));
      width: calc(160 * var(--u));
      height: calc(14 * var(--u));
      position: relative;
      opacity: 0.9;
    }
    .bottom-mark svg { width: 100%; height: 100%; }

    .signoff {
      margin-top: calc(18 * var(--u));
      font-family: 'Great Vibes', cursive;
      font-size: calc(28 * var(--u));
      color: rgba(232, 197, 71, 0.85);
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px rgba(212,175,55,0.3);
      animation: fade-down 1s ease 0.9s backwards;
    }
    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ========== FULLSCREEN BUTTON ========== */
    .fs-btn {
      position: fixed;
      right: clamp(16px, 2.5vw, 28px);
      bottom: clamp(16px, 2.5vh, 28px);
      z-index: 50;
      appearance: none;
      border: 1px solid rgba(201, 162, 39, 0.5);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(30, 24, 10, 0.92), rgba(8, 6, 2, 0.95));
      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.55),
        0 0 20px rgba(212, 175, 55, 0.15),
        inset 0 1px 0 rgba(255, 240, 180, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--gold-2);
      transition: transform 0.18s ease, box-shadow 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    .fs-btn:hover {
      transform: scale(1.07);
      border-color: rgba(232, 197, 71, 0.8);
      color: #fff3c4;
      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(212, 175, 55, 0.35),
        inset 0 1px 0 rgba(255, 240, 180, 0.18);
    }
    .fs-btn:active { transform: scale(0.95); }
    .fs-btn:focus-visible {
      outline: 2px solid var(--gold-3);
      outline-offset: 3px;
    }
    .fs-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fs-btn .icon-exit { display: none; }
    .fs-btn.is-full .icon-enter { display: none; }
    .fs-btn.is-full .icon-exit { display: block; }

    @media (max-width: 480px) {
      .fs-btn { width: 44px; height: 44px; }
      .fs-btn svg { width: 20px; height: 20px; }
    }

    /* Preview-only badge (removed on the real root page) */
    .preview-tag {
      position: fixed;
      left: clamp(12px, 2vw, 22px);
      bottom: clamp(14px, 2.2vh, 26px);
      z-index: 50;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f0d78c;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(201, 162, 39, 0.5);
      background: linear-gradient(135deg, rgba(30,24,10,0.9), rgba(8,6,2,0.92));
      box-shadow: 0 6px 20px rgba(0,0,0,0.5), 0 0 16px rgba(212,175,55,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      user-select: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;

  <script>
    (function () {
      // Generate rising golden dust particles (purely decorative)
      var layer = document.getElementById('sparkles');
      if (layer) {
        var reduceMotion = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduceMotion) {
          // Fewer particles on small / low-res screens (phones, cheap boards)
          // to cut overdraw and keep motion smooth.
          var vw = window.innerWidth || 1280;
          var vh = window.innerHeight || 720;
          var COUNT = (Math.min(vw, vh) < 600) ? 14 : 26;
          for (var i = 0; i < COUNT; i++) {
            var p = document.createElement('span');
            p.className = 'dust';
            var size = 2 + Math.random() * 3.5;
            p.style.width = size.toFixed(1) + 'px';
            p.style.height = size.toFixed(1) + 'px';
            p.style.left = (Math.random() * 100).toFixed(2) + '%';
            p.style.setProperty('--rd', (11 + Math.random() * 12).toFixed(1) + 's');
            p.style.setProperty('--rdelay', (-Math.random() * 16).toFixed(1) + 's');
            p.style.setProperty('--rop', (0.35 + Math.random() * 0.45).toFixed(2));
            layer.appendChild(p);
          }
        }
      }

      // ===== Fullscreen toggle =====
      var fsBtn = document.getElementById('fsBtn');
      if (fsBtn) {
        var doc = document;
        var root = doc.documentElement;

        function isFullscreen() {
          return !!(doc.fullscreenElement || doc.webkitFullscreenElement ||
                    doc.msFullscreenElement);
        }
        function enterFs() {
          if (root.requestFullscreen) return root.requestFullscreen();
          if (root.webkitRequestFullscreen) return root.webkitRequestFullscreen();
          if (root.msRequestFullscreen) return root.msRequestFullscreen();
          return Promise.reject(new Error('unsupported'));
        }
        function exitFs() {
          if (doc.exitFullscreen) return doc.exitFullscreen();
          if (doc.webkitExitFullscreen) return doc.webkitExitFullscreen();
          if (doc.msExitFullscreen) return doc.msExitFullscreen();
          return Promise.reject(new Error('unsupported'));
        }
        function syncBtn() {
          var on = isFullscreen();
          fsBtn.classList.toggle('is-full', on);
          fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
          fsBtn.title = on ? 'Exit fullscreen' : 'Fullscreen';
        }

        fsBtn.addEventListener('click', function () {
          var p = isFullscreen() ? exitFs() : enterFs();
          if (p && typeof p.then === 'function') {
            p.then(syncBtn).catch(function () { syncBtn(); });
          } else {
            syncBtn();
          }
        });

        doc.addEventListener('fullscreenchange', syncBtn);
        doc.addEventListener('webkitfullscreenchange', syncBtn);
        doc.addEventListener('msfullscreenchange', syncBtn);

        var supported = root.requestFullscreen || root.webkitRequestFullscreen ||
                        root.msRequestFullscreen;
        if (!supported) fsBtn.style.display = 'none';
      }
    })();
  </script>
