<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Teacher's Day | Celebrations</title>
  <meta name="theme-color" content="#000000" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .banner {
      width: 100vw;
      height: 100vh;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ===== OUTER ORNATE FRAME ===== */
    .ornate-border {
      position: absolute;
      inset: 2.8%;
      border: 1.5px solid #c9a227;
      pointer-events: none;
      z-index: 2;
    }

    /* Inner thin line */
    .ornate-border::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(201, 162, 39, 0.35);
    }

    /* Corner flourishes — pure CSS/SVG via background */
    .corner {
      position: absolute;
      width: 90px;
      height: 90px;
      z-index: 3;
      pointer-events: none;
    }
    .corner svg { width: 100%; height: 100%; display: block; overflow: visible; }

    .tl { top: 2.2%; left: 2.2%; }
    .tr { top: 2.2%; right: 2.2%; transform: scaleX(-1); }
    .bl { bottom: 2.2%; left: 2.2%; transform: scaleY(-1); }
    .br { bottom: 2.2%; right: 2.2%; transform: scale(-1); }

    /* ===== SPARKLES (subtle, sides only like the image) ===== */
    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        /* left cluster */
        radial-gradient(circle 1.2px at 4% 22%, #ffd86b 100%, transparent 100%),
        radial-gradient(circle 1.8px at 6.5% 38%, #f0d78c 100%, transparent 100%),
        radial-gradient(circle 1px at 3.5% 55%, #d4af37 100%, transparent 100%),
        radial-gradient(circle 1.5px at 7% 68%, #ffe9a0 100%, transparent 100%),
        radial-gradient(circle 1px at 5% 80%, #c9a227 100%, transparent 100%),
        radial-gradient(circle 2px at 8% 28%, #fff3c4 100%, transparent 100%),
        radial-gradient(circle 1px at 9% 48%, #d4af37 100%, transparent 100%),
        radial-gradient(circle 1.3px at 4.5% 12%, #f0d78c 100%, transparent 100%),
        /* right cluster */
        radial-gradient(circle 1.5px at 96% 20%, #ffd86b 100%, transparent 100%),
        radial-gradient(circle 1.2px at 93.5% 35%, #f0d78c 100%, transparent 100%),
        radial-gradient(circle 2px at 97% 50%, #ffe9a0 100%, transparent 100%),
        radial-gradient(circle 1px at 94% 62%, #d4af37 100%, transparent 100%),
        radial-gradient(circle 1.6px at 96.5% 74%, #fff3c4 100%, transparent 100%),
        radial-gradient(circle 1px at 92.5% 85%, #c9a227 100%, transparent 100%),
        radial-gradient(circle 1.4px at 95% 28%, #f0d78c 100%, transparent 100%),
        radial-gradient(circle 1.1px at 98% 42%, #d4af37 100%, transparent 100%),
        /* soft dust near corners */
        radial-gradient(circle 1px at 12% 10%, rgba(240,215,140,0.7) 100%, transparent 100%),
        radial-gradient(circle 1px at 88% 12%, rgba(240,215,140,0.7) 100%, transparent 100%),
        radial-gradient(circle 1px at 11% 90%, rgba(212,175,55,0.6) 100%, transparent 100%),
        radial-gradient(circle 1px at 89% 88%, rgba(212,175,55,0.6) 100%, transparent 100%);
      opacity: 0.9;
    }

    /* 4-point star accents */
    .star {
      position: absolute;
      color: #e8c547;
      font-size: 11px;
      z-index: 1;
      text-shadow: 0 0 6px rgba(255, 220, 100, 0.8);
      line-height: 1;
      pointer-events: none;
    }
    .s1 { top: 18%; left: 5.5%; font-size: 13px; }
    .s2 { top: 42%; left: 3.8%; font-size: 9px; opacity: 0.75; }
    .s3 { top: 70%; left: 6.5%; font-size: 12px; }
    .s4 { top: 25%; right: 5%; font-size: 14px; }
    .s5 { top: 55%; right: 3.5%; font-size: 9px; opacity: 0.75; }
    .s6 { top: 78%; right: 6%; font-size: 11px; }

    /* ===== CONTENT ===== */
    .content {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 1100px;
      padding: 0 8%;
      gap: 0;
    }

    /* Laurel wreath */
    .laurel {
      width: clamp(70px, 8vw, 105px);
      height: auto;
      margin-bottom: clamp(10px, 1.8vh, 22px);
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
    }

    /* Main title */
    h1 {
      font-family: 'Cinzel', 'Times New Roman', Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.7rem, 5.5vw, 4.4rem);
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
      margin: 0;
      white-space: nowrap;
      background: linear-gradient(
        180deg,
        #fff8d6 0%,
        #f5e09a 18%,
        #e8c547 42%,
        #c9a227 68%,
        #a07818 88%,
        #c9a227 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 1px 0 rgba(80, 55, 0, 0.5))
        drop-shadow(0 0 20px rgba(212, 175, 55, 0.28));
    }

    /* Script "Celebrations" */
    .script {
      font-family: 'Great Vibes', 'Segoe Script', cursive;
      font-size: clamp(1.6rem, 4vw, 3.1rem);
      font-weight: 400;
      line-height: 1;
      margin-top: clamp(2px, 0.5vh, 6px);
      margin-bottom: 0;
      background: linear-gradient(180deg, #fff0b8 0%, #e0b83a 50%, #b8922a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.25));
      letter-spacing: 0.02em;
    }

    /* Divider with diamond */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: clamp(140px, 22vw, 260px);
      margin: clamp(10px, 1.6vh, 18px) 0;
    }
    .divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a227 30%, #e8c547 50%, #c9a227 70%, transparent);
    }
    .divider .dia {
      width: 7px;
      height: 7px;
      background: linear-gradient(135deg, #f0d78c, #c9a227);
      transform: rotate(45deg);
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.7);
      flex-shrink: 0;
    }

    /* Subtitles */
    .lines {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-weight: 500;
      font-size: clamp(0.95rem, 1.9vw, 1.45rem);
      letter-spacing: 0.04em;
      line-height: 1.55;
      color: #e0c56a;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
    }
    .lines span {
      display: block;
    }

    /* Icons row */
    .icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(36px, 5.5vw, 72px);
      margin: clamp(16px, 2.6vh, 30px) 0 clamp(14px, 2.2vh, 26px);
    }
    .icons svg {
      width: clamp(38px, 4.5vw, 58px);
      height: clamp(38px, 4.5vw, 58px);
      stroke: #d4af37;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.35));
    }
    .icons svg .fill-gold {
      fill: #d4af37;
      stroke: none;
    }

    /* Date */
    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2vw, 22px);
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 600;
      font-size: clamp(1rem, 2.1vw, 1.55rem);
      letter-spacing: 0.14em;
      color: #e8c547;
      text-shadow: 0 0 14px rgba(212, 175, 55, 0.35);
    }
    .date-row .spark {
      font-size: 0.75em;
      color: #f0d78c;
      text-shadow: 0 0 8px rgba(255, 220, 120, 0.9);
    }

    /* Bottom tiny ornament line */
    .bottom-orn {
      margin-top: clamp(10px, 1.5vh, 16px);
      width: clamp(80px, 12vw, 140px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
      position: relative;
    }
    .bottom-orn::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      background: #d4af37;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 5px rgba(212, 175, 55, 0.6);
    }

    /* Ultra-wide boards */
    @media (min-aspect-ratio: 21/9) {
      h1 { font-size: clamp(2rem, 4.5vw, 3.8rem); }
      .content { max-width: 1300px; }
    }

    /* Slightly shorter height */
    @media (max-height: 600px) {
      .laurel { width: 55px; margin-bottom: 6px; }
      .icons { margin: 10px 0 8px; gap: 28px; }
      .icons svg { width: 32px; height: 32px; }
      .divider { margin: 6px 0; }
    }
  </style>
</head>
<body>
  <div class="banner">

    <!-- Sparkle dust -->
    <div class="sparkles" aria-hidden="true"></div>
    <span class="star s1" aria-hidden="true">✦</span>
    <span class="star s2" aria-hidden="true">✧</span>
    <span class="star s3" aria-hidden="true">✦</span>
    <span class="star s4" aria-hidden="true">✦</span>
    <span class="star s5" aria-hidden="true">✧</span>
    <span class="star s6" aria-hidden="true">✦</span>

    <!-- Frame -->
    <div class="ornate-border" aria-hidden="true"></div>

    <!-- Corners -->
    <div class="corner tl" aria-hidden="true">
      <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 78 C4 30 30 4 78 4" stroke="#c9a227" stroke-width="1.8"/>
        <path d="M4 60 C4 26 26 4 60 4" stroke="#d4af37" stroke-width="1" opacity="0.55"/>
        <!-- scroll curl -->
        <path d="M10 28 C18 10, 38 8, 42 22 C46 34, 28 38, 22 28 C18 20, 28 16, 32 24"
              stroke="#d4af37" stroke-width="1.6" fill="none"/>
        <path d="M8 48 C8 48, 20 36, 34 40 C28 48, 14 52, 8 48Z" fill="#c9a227" opacity="0.85"/>
        <circle cx="8" cy="8" r="2.5" fill="#f0d78c"/>
        <path d="M4 78 Q4 70 12 70" stroke="#c9a227" stroke-width="1.2" opacity="0.6"/>
      </svg>
    </div>
    <div class="corner tr" aria-hidden="true">
      <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 78 C4 30 30 4 78 4" stroke="#c9a227" stroke-width="1.8"/>
        <path d="M4 60 C4 26 26 4 60 4" stroke="#d4af37" stroke-width="1" opacity="0.55"/>
        <path d="M10 28 C18 10, 38 8, 42 22 C46 34, 28 38, 22 28 C18 20, 28 16, 32 24"
              stroke="#d4af37" stroke-width="1.6" fill="none"/>
        <path d="M8 48 C8 48, 20 36, 34 40 C28 48, 14 52, 8 48Z" fill="#c9a227" opacity="0.85"/>
        <circle cx="8" cy="8" r="2.5" fill="#f0d78c"/>
        <path d="M4 78 Q4 70 12 70" stroke="#c9a227" stroke-width="1.2" opacity="0.6"/>
      </svg>
    </div>
    <div class="corner bl" aria-hidden="true">
      <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 78 C4 30 30 4 78 4" stroke="#c9a227" stroke-width="1.8"/>
        <path d="M4 60 C4 26 26 4 60 4" stroke="#d4af37" stroke-width="1" opacity="0.55"/>
        <path d="M10 28 C18 10, 38 8, 42 22 C46 34, 28 38, 22 28 C18 20, 28 16, 32 24"
              stroke="#d4af37" stroke-width="1.6" fill="none"/>
        <path d="M8 48 C8 48, 20 36, 34 40 C28 48, 14 52, 8 48Z" fill="#c9a227" opacity="0.85"/>
        <circle cx="8" cy="8" r="2.5" fill="#f0d78c"/>
        <path d="M4 78 Q4 70 12 70" stroke="#c9a227" stroke-width="1.2" opacity="0.6"/>
      </svg>
    </div>
    <div class="corner br" aria-hidden="true">
      <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 78 C4 30 30 4 78 4" stroke="#c9a227" stroke-width="1.8"/>
        <path d="M4 60 C4 26 26 4 60 4" stroke="#d4af37" stroke-width="1" opacity="0.55"/>
        <path d="M10 28 C18 10, 38 8, 42 22 C46 34, 28 38, 22 28 C18 20, 28 16, 32 24"
              stroke="#d4af37" stroke-width="1.6" fill="none"/>
        <path d="M8 48 C8 48, 20 36, 34 40 C28 48, 14 52, 8 48Z" fill="#c9a227" opacity="0.85"/>
        <circle cx="8" cy="8" r="2.5" fill="#f0d78c"/>
        <path d="M4 78 Q4 70 12 70" stroke="#c9a227" stroke-width="1.2" opacity="0.6"/>
      </svg>
    </div>

    <!-- Main content -->
    <div class="content">

      <!-- Laurel wreath -->
      <svg class="laurel" viewBox="0 0 120 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f5e09a"/>
            <stop offset="50%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#a07818"/>
          </linearGradient>
        </defs>
        <!-- left branch -->
        <g fill="url(#g)">
          <path d="M60 66 C48 52 28 46 14 52 C24 38 42 32 58 40 C48 30 32 18 22 6 C40 14 52 30 60 46Z"/>
          <ellipse cx="28" cy="28" rx="5.5" ry="10" transform="rotate(-42 28 28)"/>
          <ellipse cx="36" cy="20" rx="5" ry="9" transform="rotate(-55 36 20)"/>
          <ellipse cx="44" cy="36" rx="5.5" ry="10" transform="rotate(-28 44 36)"/>
          <ellipse cx="40" cy="48" rx="5" ry="9" transform="rotate(-15 40 48)"/>
          <ellipse cx="22" cy="40" rx="4.5" ry="8" transform="rotate(-50 22 40)"/>
        </g>
        <!-- right branch -->
        <g fill="url(#g)">
          <path d="M60 66 C72 52 92 46 106 52 C96 38 78 32 62 40 C72 30 88 18 98 6 C80 14 68 30 60 46Z"/>
          <ellipse cx="92" cy="28" rx="5.5" ry="10" transform="rotate(42 92 28)"/>
          <ellipse cx="84" cy="20" rx="5" ry="9" transform="rotate(55 84 20)"/>
          <ellipse cx="76" cy="36" rx="5.5" ry="10" transform="rotate(28 76 36)"/>
          <ellipse cx="80" cy="48" rx="5" ry="9" transform="rotate(15 80 48)"/>
          <ellipse cx="98" cy="40" rx="4.5" ry="8" transform="rotate(50 98 40)"/>
        </g>
        <circle cx="60" cy="64" r="3" fill="#f0d78c"/>
      </svg>

      <h1>Happy Teacher's Day</h1>
      <p class="script">Celebrations</p>

      <div class="divider" aria-hidden="true">
        <span class="line"></span>
        <span class="dia"></span>
        <span class="line"></span>
      </div>

      <div class="lines">
        <span>Coaching Mein Special Celebrations</span>
        <span>Shukriya Teachers — Aapke Guidance Ke Liye</span>
      </div>

      <div class="icons" aria-hidden="true">
        <!-- Open book -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 16C24 13 10 13 8 16v32c6-3 18-3 24 0 6-3 18-3 24 0V16c-2-3-16-3-24 0z"/>
          <path d="M32 16v32"/>
          <path d="M14 24h14M14 32h14M14 40h10"/>
          <path d="M36 24h14M36 32h14M40 40h10"/>
        </svg>
        <!-- Graduation cap -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 28 L32 14 L58 28 L32 42 Z"/>
          <path d="M16 34v14s8 8 16 8 16-8 16-8V34"/>
          <path d="M58 28v14"/>
          <circle class="fill-gold" cx="58" cy="44" r="2.5"/>
          <path d="M58 42v-4"/>
        </svg>
        <!-- Apple -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 20c0 0-3-10 6-12 0 8-6 12-6 12z" class="fill-gold"/>
          <path d="M32 22c-10 0-18 8-18 18s8 18 18 18 18-8 18-18-8-18-18-18z"/>
          <path d="M32 22c-2 6-2 10 0 10"/>
        </svg>
      </div>

      <div class="date-row">
        <span class="spark">✦</span>
        <span>5th September</span>
        <span class="spark">✦</span>
      </div>

      <div class="bottom-orn" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
