<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Teacher's Day | Celebrations</title>
  <meta name="description" content="Teacher's Day Celebrations — 5th September" />
  <meta name="theme-color" content="#000000" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Full-screen banner for smart board / projector */
    img.banner {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain; /* full banner visible, no crop */
      background: #000;
      cursor: default;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Optional: if board is very wide and you want edge-to-edge fill, change contain → cover above */
  </style>
</head>
<body>
  <img
    class="banner"
    src="/banner.jpg"
    alt="Happy Teacher's Day Celebrations"
    draggable="false"
  />
</body>
</html>
