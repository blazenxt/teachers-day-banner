<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Teacher's Day | Celebrations</title>
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold-1: #fff8d0;
      --gold-2: #f5e09a;
      --gold-3: #e8c547;
      --gold-4: #d4af37;
      --gold-5: #c9a227;
      --gold-6: #a07818;
      --gold-7: #6e5210;
      --black: #000000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--black);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== STAGE ========== */
    .banner {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, #16100a 0%, #070500 48%, #000 100%);
    }

    /* Soft vignette */
    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Ambient gold glow behind content */
    .glow {
      position: absolute;
      width: min(70vw, 900px);
      height: min(55vh, 520px);
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(212, 175, 55, 0.16) 0%,
        rgba(212, 175, 55, 0.06) 35%,
        transparent 70%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 1;
      animation: pulse-glow 5s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
    }

    /* ========== SPARKLES ========== */
    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gold-2);
      box-shadow: 0 0 6px 1px rgba(255, 220, 120, 0.85);
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      opacity: 0.3;
    }

    .spark.cross {
      width: 0;
      height: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--gold-3);
      font-size: var(--sz, 12px);
      text-shadow: 0 0 8px rgba(255, 220, 100, 0.9);
      line-height: 1;
    }
    .spark.cross::before { content: "✦"; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* ========== FRAME ========== */
    .frame {
      position: absolute;
      inset: clamp(14px, 2.6vh, 28px) clamp(16px, 2.8vw, 36px);
      z-index: 3;
      pointer-events: none;
    }

    /* Outer gold line */
    .frame-outer {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgba(201, 162, 39, 0.85);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.8),
        inset 0 0 40px rgba(212, 175, 55, 0.03);
    }

    /* Inner gold line */
    .frame-inner {
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(212, 175, 55, 0.32);
    }

    /* Mid-side diamond ticks */
    .tick {
      position: absolute;
      width: 8px;
      height: 8px;
      background: linear-gradient(135deg, var(--gold-2), var(--gold-5));
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.55);
      z-index: 4;
    }
    .tick.top { top: -4px; left: 50%; margin-left: -4px; }
    .tick.bottom { bottom: -4px; left: 50%; margin-left: -4px; }
    .tick.left { left: -4px; top: 50%; margin-top: -4px; }
    .tick.right { right: -4px; top: 50%; margin-top: -4px; }

    /* Ornate corners */
    .corner {
      position: absolute;
      width: clamp(72px, 9vw, 110px);
      height: clamp(72px, 9vw, 110px);
      z-index: 5;
    }
    .corner svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .tl { top: -2px; left: -2px; }
    .tr { top: -2px; right: -2px; transform: scaleX(-1); }
    .bl { bottom: -2px; left: -2px; transform: scaleY(-1); }
    .br { bottom: -2px; right: -2px; transform: scale(-1); }

    /* ========== CONTENT ========== */
    .content {
      position: relative;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: min(92vw, 1080px);
      padding: clamp(20px, 4vh, 48px) clamp(16px, 3vw, 40px);
      animation: rise-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px) scale(0.985); filter: blur(4px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* Small top label */
    .eyebrow {
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 600;
      font-size: clamp(0.65rem, 1.1vw, 0.85rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(232, 197, 71, 0.75);
      margin-bottom: clamp(10px, 1.6vh, 18px);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: clamp(28px, 4vw, 52px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-5));
    }
    .eyebrow::after {
      background: linear-gradient(90deg, var(--gold-5), transparent);
    }

    /* Laurel */
    .laurel {
      width: clamp(78px, 9vw, 118px);
      height: auto;
      margin-bottom: clamp(8px, 1.4vh, 16px);
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.45));
      animation: float-soft 6s ease-in-out infinite;
    }

    @keyframes float-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Title */
    h1 {
      font-family: 'Cinzel', 'Times New Roman', Georgia, serif;
      font-weight: 800;
      font-size: clamp(1.55rem, 5.4vw, 4.35rem);
      letter-spacing: 0.085em;
      line-height: 1.02;
      text-transform: uppercase;
      margin: 0;
      white-space: nowrap;
      background: linear-gradient(
        175deg,
        #fffef5 0%,
        #fff8d0 8%,
        #f5e09a 22%,
        #e8c547 40%,
        #d4af37 55%,
        #a07818 78%,
        #d4af37 92%,
        #f0d78c 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 2px 0 rgba(60, 40, 0, 0.55))
        drop-shadow(0 0 28px rgba(212, 175, 55, 0.35));
      position: relative;
    }

    /* Script */
    .script {
      font-family: 'Great Vibes', 'Segoe Script', cursive;
      font-size: clamp(1.7rem, 4.2vw, 3.35rem);
      font-weight: 400;
      line-height: 1.05;
      margin-top: clamp(4px, 0.8vh, 10px);
      background: linear-gradient(180deg, #fff3c4 0%, #e8c547 48%, #b8922a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.3));
      letter-spacing: 0.03em;
    }

    /* Ornamental divider */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: clamp(160px, 26vw, 300px);
      margin: clamp(12px, 2vh, 22px) 0;
    }
    .divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-5) 20%, var(--gold-3) 50%, var(--gold-5) 80%, transparent);
    }
    .divider .jewel {
      position: relative;
      width: 10px;
      height: 10px;
      flex-shrink: 0;
    }
    .divider .jewel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold-1), var(--gold-5));
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.75);
    }
    .divider .jewel::after {
      content: "";
      position: absolute;
      inset: 3px;
      background: #1a1408;
      transform: rotate(45deg);
    }

    /* Subtitles */
    .lines {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: clamp(1rem, 2vw, 1.55rem);
      letter-spacing: 0.06em;
      line-height: 1.65;
      color: #e6cb72;
      text-shadow: 0 0 18px rgba(212, 175, 55, 0.22);
    }
    .lines .primary {
      display: block;
      font-weight: 600;
      font-size: 1.08em;
      color: #f0d78c;
      letter-spacing: 0.08em;
    }
    .lines .secondary {
      display: block;
      font-style: italic;
      opacity: 0.88;
      font-size: 0.95em;
      letter-spacing: 0.05em;
      color: #d4b85a;
    }

    /* Icons */
    .icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vw, 68px);
      margin: clamp(18px, 2.8vh, 32px) 0;
    }

    .icon-wrap {
      position: relative;
      width: clamp(52px, 5.5vw, 72px);
      height: clamp(52px, 5.5vw, 72px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%,
        rgba(212, 175, 55, 0.12) 0%,
        rgba(212, 175, 55, 0.03) 55%,
        transparent 70%);
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.22),
        0 0 20px rgba(212, 175, 55, 0.1);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      animation: icon-in 0.9s ease backwards;
    }
    .icon-wrap:nth-child(1) { animation-delay: 0.35s; }
    .icon-wrap:nth-child(2) { animation-delay: 0.5s; }
    .icon-wrap:nth-child(3) { animation-delay: 0.65s; }

    @keyframes icon-in {
      from { opacity: 0; transform: translateY(12px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap svg {
      width: 58%;
      height: 58%;
      stroke: url(#iconStroke);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.4));
    }
    .icon-wrap svg .fg {
      fill: url(#iconFill);
      stroke: none;
    }

    /* Date badge */
    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: clamp(12px, 1.8vw, 20px);
      padding: clamp(8px, 1.2vh, 12px) clamp(22px, 3vw, 36px);
      border: 1px solid rgba(201, 162, 39, 0.45);
      border-radius: 999px;
      background: linear-gradient(180deg,
        rgba(212, 175, 55, 0.1) 0%,
        rgba(0, 0, 0, 0.25) 100%);
      box-shadow:
        0 0 24px rgba(212, 175, 55, 0.12),
        inset 0 1px 0 rgba(255, 240, 180, 0.12);
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 700;
      font-size: clamp(0.95rem, 2vw, 1.45rem);
      letter-spacing: 0.18em;
      color: #f0d78c;
      text-shadow: 0 0 14px rgba(212, 175, 55, 0.4);
      margin-top: clamp(4px, 0.8vh, 10px);
    }
    .date-badge .spark {
      position: static;
      width: auto;
      height: auto;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      animation: none;
      opacity: 1;
      font-size: 0.7em;
      color: var(--gold-3);
      text-shadow: 0 0 8px rgba(255, 220, 120, 0.85);
    }

    /* Bottom flourish */
    .bottom-mark {
      margin-top: clamp(14px, 2vh, 22px);
      width: clamp(100px, 14vw, 160px);
      height: 14px;
      position: relative;
      opacity: 0.9;
    }
    .bottom-mark svg { width: 100%; height: 100%; }

    /* Ultra-wide smart boards */
    @media (min-aspect-ratio: 21/9) {
      h1 { font-size: clamp(1.8rem, 4.2vw, 3.6rem); }
      .content { width: min(80vw, 1200px); }
    }

    @media (max-height: 560px) {
      .eyebrow { margin-bottom: 6px; letter-spacing: 0.3em; }
      .laurel { width: 58px; margin-bottom: 4px; }
      .icons { margin: 10px 0; gap: 20px; }
      .icon-wrap { width: 44px; height: 44px; }
      .divider { margin: 8px 0; }
      .date-badge { padding: 6px 18px; }
      .bottom-mark { margin-top: 8px; }
    }

    @media (max-width: 520px) {
      h1 {
        white-space: normal;
        font-size: clamp(1.35rem, 7.5vw, 2rem);
        letter-spacing: 0.06em;
        max-width: 14ch;
      }
      .script { font-size: clamp(1.4rem, 8vw, 2.2rem); }
    }

    /* ========== MUSIC PLAYER ========== */
    .music-dock {
      position: fixed;
      right: clamp(16px, 2.5vw, 28px);
      bottom: clamp(16px, 2.5vh, 28px);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px 10px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(30, 24, 10, 0.92), rgba(8, 6, 2, 0.95));
      border: 1px solid rgba(201, 162, 39, 0.45);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.55),
        0 0 24px rgba(212, 175, 55, 0.12),
        inset 0 1px 0 rgba(255, 240, 180, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: 'Cinzel', Georgia, serif;
      color: var(--gold-2, #f5e09a);
      user-select: none;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .music-dock.playing {
      border-color: rgba(232, 197, 71, 0.7);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.55),
        0 0 36px rgba(212, 175, 55, 0.28),
        inset 0 1px 0 rgba(255, 240, 180, 0.14);
    }

    .music-btn {
      appearance: none;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #e8c547 0%, #c9a227 45%, #8a6a12 100%);
      box-shadow:
        0 2px 0 rgba(60, 40, 0, 0.5),
        0 0 16px rgba(212, 175, 55, 0.35);
      color: #1a1205;
      transition: transform 0.15s ease, filter 0.15s ease;
      flex-shrink: 0;
    }

    .music-btn:hover { transform: scale(1.05); filter: brightness(1.08); }
    .music-btn:active { transform: scale(0.97); }

    .music-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .music-btn .icon-pause { display: none; }
    .music-dock.playing .music-btn .icon-play { display: none; }
    .music-dock.playing .music-btn .icon-pause { display: block; }

    .music-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      padding-right: 6px;
    }

    .music-meta .label {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(232, 197, 71, 0.65);
      line-height: 1;
    }

    .music-meta .title {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #f0d78c;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Equalizer bars */
    .eq {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      margin-left: 2px;
      opacity: 0.35;
    }
    .music-dock.playing .eq { opacity: 1; }

    .eq span {
      width: 3px;
      height: 4px;
      border-radius: 1px;
      background: linear-gradient(180deg, #fff3c4, #d4af37);
      animation: none;
    }
    .music-dock.playing .eq span {
      animation: eq-bounce 0.9s ease-in-out infinite;
    }
    .music-dock.playing .eq span:nth-child(1) { animation-delay: 0s; }
    .music-dock.playing .eq span:nth-child(2) { animation-delay: 0.15s; }
    .music-dock.playing .eq span:nth-child(3) { animation-delay: 0.3s; }
    .music-dock.playing .eq span:nth-child(4) { animation-delay: 0.1s; }

    @keyframes eq-bounce {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }

    /* First-tap overlay for browsers that block autoplay */
    .music-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .music-gate.show {
      opacity: 1;
      pointer-events: auto;
    }
    .music-gate-card {
      text-align: center;
      padding: 36px 40px;
      border-radius: 20px;
      border: 1px solid rgba(201, 162, 39, 0.5);
      background: linear-gradient(160deg, rgba(30, 24, 10, 0.95), rgba(8, 6, 2, 0.98));
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212, 175, 55, 0.15);
      max-width: 90vw;
    }
    .music-gate-card p {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.15rem;
      color: rgba(240, 215, 140, 0.85);
      margin-bottom: 18px;
      letter-spacing: 0.04em;
    }
    .music-gate-card button {
      appearance: none;
      border: 1px solid rgba(212, 175, 55, 0.6);
      background: linear-gradient(180deg, #3a2f12, #1a1508);
      color: #f0d78c;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 14px 28px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
    }
    .music-gate-card button svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (max-width: 480px) {
      .music-meta .title { font-size: 0.72rem; }
      .music-dock { padding: 8px 12px 8px 8px; }
      .music-btn { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="glow" aria-hidden="true"></div>

    <!-- Animated sparkles -->
    <div class="sparkles" aria-hidden="true">
      <span class="spark" style="left:4%;top:18%;--delay:0s;--d:3.2s"></span>
      <span class="spark" style="left:7%;top:36%;--delay:0.4s;--d:2.8s"></span>
      <span class="spark" style="left:3.5%;top:58%;--delay:1s;--d:3.5s"></span>
      <span class="spark" style="left:8%;top:74%;--delay:0.7s;--d:2.6s"></span>
      <span class="spark" style="left:5.5%;top:48%;--delay:1.4s;--d:3s"></span>
      <span class="spark" style="left:95%;top:20%;--delay:0.2s;--d:3.1s"></span>
      <span class="spark" style="left:92.5%;top:40%;--delay:0.9s;--d:2.7s"></span>
      <span class="spark" style="left:96.5%;top:55%;--delay:0.5s;--d:3.4s"></span>
      <span class="spark" style="left:93%;top:72%;--delay:1.2s;--d:2.9s"></span>
      <span class="spark" style="left:97%;top:32%;--delay:1.6s;--d:3.3s"></span>
      <span class="spark" style="left:12%;top:12%;--delay:0.3s;--d:2.5s"></span>
      <span class="spark" style="left:88%;top:14%;--delay:0.8s;--d:2.8s"></span>
      <span class="spark" style="left:14%;top:88%;--delay:1.1s;--d:3s"></span>
      <span class="spark" style="left:86%;top:86%;--delay:0.6s;--d:2.6s"></span>
      <span class="spark cross" style="left:5%;top:28%;--delay:0s;--d:4s;--sz:13px"></span>
      <span class="spark cross" style="left:94%;top:26%;--delay:1s;--d:3.6s;--sz:15px"></span>
      <span class="spark cross" style="left:6.5%;top:66%;--delay:0.5s;--d:4.2s;--sz:11px"></span>
      <span class="spark cross" style="left:93.5%;top:64%;--delay:1.5s;--d:3.8s;--sz:12px"></span>
      <span class="spark cross" style="left:10%;top:82%;--delay:0.8s;--d:4.5s;--sz:10px"></span>
      <span class="spark cross" style="left:90%;top:80%;--delay:1.3s;--d:4s;--sz:11px"></span>
    </div>

    <!-- Frame -->
    <div class="frame" aria-hidden="true">
      <div class="frame-outer"></div>
      <div class="frame-inner"></div>
      <span class="tick top"></span>
      <span class="tick bottom"></span>
      <span class="tick left"></span>
      <span class="tick right"></span>

  <script>
    (function () {
      const audio = document.getElementById('tdSong');
      const dock = document.getElementById('musicDock');
      const toggle = document.getElementById('musicToggle');
      const gate = document.getElementById('musicGate');
      const startBtn = document.getElementById('musicStart');

      if (!audio || !dock || !toggle) return;

      audio.volume = 0.55;

      function setPlaying(on) {
        dock.classList.toggle('playing', on);
        toggle.setAttribute('aria-label', on ? 'Pause music' : 'Play music');
      }

      function play() {
        const p = audio.play();
        if (p && typeof p.then === 'function') {
          return p.then(function () {
            setPlaying(true);
            hideGate();
            return true;
          }).catch(function () {
            setPlaying(false);
            return false;
          });
        }
        setPlaying(!audio.paused);
        return Promise.resolve(!audio.paused);
      }

      function pause() {
        audio.pause();
        setPlaying(false);
      }

      function hideGate() {
        gate.classList.remove('show');
        gate.setAttribute('aria-hidden', 'true');
      }

      function showGate() {
        gate.classList.add('show');
        gate.setAttribute('aria-hidden', 'false');
      }

      toggle.addEventListener('click', function () {
        if (audio.paused) play();
        else pause();
      });

      startBtn.addEventListener('click', function () {
        play();
      });

      // Tap anywhere on gate to start
      gate.addEventListener('click', function (e) {
        if (e.target === gate) play();
      });

      audio.addEventListener('play', function () { setPlaying(true); });
      audio.addEventListener('pause', function () { setPlaying(false); });
      audio.addEventListener('ended', function () { setPlaying(false); });

      // Try autoplay on load (works on many smart-board browsers / kiosk mode)
      play().then(function (ok) {
        if (!ok) {
          // Soft retry on first user gesture anywhere
          showGate();
          const unlock = function () {
            play().then(function (started) {
              if (started) {
                document.removeEventListener('pointerdown', unlock, true);
                document.removeEventListener('keydown', unlock, true);
              }
            });
          };
          document.addEventListener('pointerdown', unlock, true);
          document.addEventListener('keydown', unlock, true);
        }
      });
    })();
  </script>
