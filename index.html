<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Teacher's Day | Celebrations</title>
  <meta name="theme-color" content="#000000" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, #0d0b05 0%, #000 70%),
        #000;
      color: #d4af37;
      font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Soft gold sparkle dust */
    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 18%, rgba(255, 220, 120, 0.9), transparent),
        radial-gradient(1.5px 1.5px at 14% 72%, rgba(212, 175, 55, 0.7), transparent),
        radial-gradient(2px 2px at 22% 40%, rgba(255, 235, 160, 0.85), transparent),
        radial-gradient(1px 1px at 30% 12%, rgba(240, 215, 140, 0.6), transparent),
        radial-gradient(1.5px 1.5px at 38% 88%, rgba(212, 175, 55, 0.75), transparent),
        radial-gradient(2px 2px at 48% 8%, rgba(255, 220, 120, 0.8), transparent),
        radial-gradient(1px 1px at 55% 65%, rgba(240, 215, 140, 0.55), transparent),
        radial-gradient(1.5px 1.5px at 62% 28%, rgba(212, 175, 55, 0.7), transparent),
        radial-gradient(2px 2px at 70% 78%, rgba(255, 235, 160, 0.85), transparent),
        radial-gradient(1px 1px at 78% 15%, rgba(240, 215, 140, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 85% 52%, rgba(212, 175, 55, 0.8), transparent),
        radial-gradient(2px 2px at 92% 30%, rgba(255, 220, 120, 0.75), transparent),
        radial-gradient(1px 1px at 95% 82%, rgba(240, 215, 140, 0.6), transparent),
        radial-gradient(1.5px 1.5px at 5% 55%, rgba(212, 175, 55, 0.7), transparent),
        radial-gradient(1px 1px at 42% 48%, rgba(255, 235, 160, 0.5), transparent),
        radial-gradient(2px 2px at 18% 90%, rgba(212, 175, 55, 0.65), transparent),
        radial-gradient(1px 1px at 88% 68%, rgba(255, 220, 120, 0.7), transparent);
      opacity: 0.85;
    }

    .stage::after {
      background-image:
        radial-gradient(1px 1px at 12% 35%, rgba(255, 235, 160, 0.7), transparent),
        radial-gradient(1.5px 1.5px at 26% 60%, rgba(212, 175, 55, 0.6), transparent),
        radial-gradient(1px 1px at 58% 22%, rgba(240, 215, 140, 0.55), transparent),
        radial-gradient(2px 2px at 74% 45%, rgba(255, 220, 120, 0.75), transparent),
        radial-gradient(1px 1px at 90% 12%, rgba(212, 175, 55, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 6% 80%, rgba(255, 235, 160, 0.6), transparent),
        radial-gradient(1px 1px at 44% 75%, rgba(240, 215, 140, 0.5), transparent),
        radial-gradient(2px 2px at 66% 92%, rgba(212, 175, 55, 0.7), transparent);
      opacity: 0.7;
    }

    /* Ornate double border frame */
    .frame {
      position: relative;
      width: min(94vw, 1600px);
      height: min(90vh, 900px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(18px, 3vh, 40px) clamp(24px, 4vw, 60px);
      border: 2px solid #c9a227;
      box-shadow:
        inset 0 0 0 1px rgba(212, 175, 55, 0.35),
        0 0 0 6px #000,
        0 0 0 8px rgba(201, 162, 39, 0.55),
        0 0 60px rgba(212, 175, 55, 0.12);
      background: linear-gradient(180deg, rgba(20, 16, 6, 0.35) 0%, rgba(0, 0, 0, 0.15) 100%);
    }

    /* Corner ornaments */
    .frame .corner {
      position: absolute;
      width: clamp(36px, 5vw, 70px);
      height: clamp(36px, 5vw, 70px);
      pointer-events: none;
    }
    .frame .corner svg { width: 100%; height: 100%; display: block; }
    .c-tl { top: 6px; left: 6px; }
    .c-tr { top: 6px; right: 6px; transform: scaleX(-1); }
    .c-bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
    .c-br { bottom: 6px; right: 6px; transform: scale(-1); }

    /* Laurel wreath */
    .laurel {
      width: clamp(64px, 9vw, 110px);
      height: auto;
      margin-bottom: clamp(6px, 1.2vh, 14px);
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.45));
    }

    h1 {
      font-size: clamp(1.8rem, 6.2vw, 5.2rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.05;
      color: #f0d78c;
      background: linear-gradient(180deg, #fff3c4 0%, #e8c547 38%, #b8860b 72%, #8a6a12 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 0 rgba(90, 60, 0, 0.55)) drop-shadow(0 0 18px rgba(212, 175, 55, 0.35));
      text-transform: uppercase;
      margin: 0;
    }

    .script {
      font-family: "Segoe Script", "Brush Script MT", "Lucida Handwriting", cursive;
      font-size: clamp(1.4rem, 3.8vw, 3.2rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.04em;
      margin-top: clamp(2px, 0.6vh, 8px);
      background: linear-gradient(180deg, #fff0b0 0%, #d4af37 55%, #a07818 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.3));
      line-height: 1.1;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: min(70%, 520px);
      margin: clamp(8px, 1.5vh, 18px) auto;
    }
    .divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
    }
    .divider .diamond {
      width: 8px;
      height: 8px;
      background: #d4af37;
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
      flex-shrink: 0;
    }

    .sub {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(0.95rem, 2.1vw, 1.65rem);
      letter-spacing: 0.04em;
      color: #e6c86a;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
      line-height: 1.35;
      margin: 0;
    }
    .sub + .sub {
      margin-top: clamp(4px, 0.8vh, 10px);
      font-size: clamp(0.85rem, 1.7vw, 1.35rem);
      color: #c9a84a;
      letter-spacing: 0.03em;
    }

    .icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vw, 64px);
      margin: clamp(14px, 2.4vh, 28px) 0 clamp(10px, 1.8vh, 20px);
    }
    .icons svg {
      width: clamp(36px, 5vw, 64px);
      height: clamp(36px, 5vw, 64px);
      stroke: #d4af37;
      fill: none;
      stroke-width: 1.6;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.35));
    }

    .date {
      font-size: clamp(1.05rem, 2.4vw, 1.9rem);
      letter-spacing: 0.12em;
      font-weight: 600;
      color: #f0d78c;
      text-shadow: 0 0 14px rgba(212, 175, 55, 0.4);
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.5vw, 18px);
    }
    .date .star {
      font-size: 0.7em;
      color: #d4af37;
      text-shadow: 0 0 10px rgba(255, 220, 120, 0.8);
    }

    .bottom-rule {
      width: min(40%, 280px);
      height: 1px;
      margin-top: clamp(10px, 1.6vh, 18px);
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
      position: relative;
    }
    .bottom-rule::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      background: #d4af37;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.6);
    }

    /* Very wide smart boards */
    @media (min-aspect-ratio: 21/9) {
      h1 { font-size: clamp(2rem, 5vw, 4.5rem); }
      .frame { height: min(88vh, 820px); }
    }

    /* Portrait / tall boards fallback */
    @media (max-aspect-ratio: 4/5) {
      h1 { font-size: clamp(1.6rem, 8vw, 3rem); letter-spacing: 0.04em; }
      .script { font-size: clamp(1.2rem, 5vw, 2rem); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <!-- Corner flourishes (inline SVG, no external files) -->
      <span class="corner c-tl" aria-hidden="true">
        <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 62 C8 28, 28 8, 62 8" stroke="#c9a227" stroke-width="2" fill="none"/>
          <path d="M8 48 C8 24, 24 8, 48 8" stroke="#d4af37" stroke-width="1.2" fill="none" opacity="0.7"/>
          <path d="M14 22 C22 14, 30 18, 26 26 C34 22, 38 30, 30 34 C34 42, 22 44, 18 36 C10 40, 8 28, 14 22Z" fill="#d4af37" opacity="0.9"/>
          <circle cx="12" cy="12" r="2.2" fill="#f0d78c"/>
        </svg>
      </span>
      <span class="corner c-tr" aria-hidden="true">
        <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 62 C8 28, 28 8, 62 8" stroke="#c9a227" stroke-width="2" fill="none"/>
          <path d="M8 48 C8 24, 24 8, 48 8" stroke="#d4af37" stroke-width="1.2" fill="none" opacity="0.7"/>
          <path d="M14 22 C22 14, 30 18, 26 26 C34 22, 38 30, 30 34 C34 42, 22 44, 18 36 C10 40, 8 28, 14 22Z" fill="#d4af37" opacity="0.9"/>
          <circle cx="12" cy="12" r="2.2" fill="#f0d78c"/>
        </svg>
      </span>
      <span class="corner c-bl" aria-hidden="true">
        <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 62 C8 28, 28 8, 62 8" stroke="#c9a227" stroke-width="2" fill="none"/>
          <path d="M8 48 C8 24, 24 8, 48 8" stroke="#d4af37" stroke-width="1.2" fill="none" opacity="0.7"/>
          <path d="M14 22 C22 14, 30 18, 26 26 C34 22, 38 30, 30 34 C34 42, 22 44, 18 36 C10 40, 8 28, 14 22Z" fill="#d4af37" opacity="0.9"/>
          <circle cx="12" cy="12" r="2.2" fill="#f0d78c"/>
        </svg>
      </span>
      <span class="corner c-br" aria-hidden="true">
        <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 62 C8 28, 28 8, 62 8" stroke="#c9a227" stroke-width="2" fill="none"/>
          <path d="M8 48 C8 24, 24 8, 48 8" stroke="#d4af37" stroke-width="1.2" fill="none" opacity="0.7"/>
          <path d="M14 22 C22 14, 30 18, 26 26 C34 22, 38 30, 30 34 C34 42, 22 44, 18 36 C10 40, 8 28, 14 22Z" fill="#d4af37" opacity="0.9"/>
          <circle cx="12" cy="12" r="2.2" fill="#f0d78c"/>
        </svg>
      </span>

      <!-- Laurel -->
      <svg class="laurel" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="#d4af37">
          <path d="M60 62 C52 50, 34 44, 22 48 C30 36, 44 30, 58 36 C50 28, 36 18, 28 8 C42 14, 54 26, 60 40 Z" opacity="0.95"/>
          <path d="M60 62 C68 50, 86 44, 98 48 C90 36, 76 30, 62 36 C70 28, 84 18, 92 8 C78 14, 66 26, 60 40 Z" opacity="0.95"/>
          <ellipse cx="34" cy="30" rx="5" ry="9" transform="rotate(-35 34 30)" opacity="0.85"/>
          <ellipse cx="42" cy="22" rx="4.5" ry="8" transform="rotate(-50 42 22)" opacity="0.8"/>
          <ellipse cx="48" cy="38" rx="5" ry="9" transform="rotate(-20 48 38)" opacity="0.85"/>
          <ellipse cx="86" cy="30" rx="5" ry="9" transform="rotate(35 86 30)" opacity="0.85"/>
          <ellipse cx="78" cy="22" rx="4.5" ry="8" transform="rotate(50 78 22)" opacity="0.8"/>
          <ellipse cx="72" cy="38" rx="5" ry="9" transform="rotate(20 72 38)" opacity="0.85"/>
          <circle cx="60" cy="58" r="3" fill="#f0d78c"/>
        </g>
      </svg>

      <h1>Happy Teacher's Day</h1>
      <div class="script">Celebrations</div>

      <div class="divider" aria-hidden="true">
        <span class="line"></span>
        <span class="diamond"></span>
        <span class="line"></span>
      </div>

      <p class="sub">Coaching Mein Special Celebrations</p>
      <p class="sub">Shukriya Teachers — Aapke Guidance Ke Liye</p>

      <div class="icons" aria-hidden="true">
        <!-- Open book -->
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 12 C18 10, 8 10, 6 12 V36 C10 34, 18 34, 24 36 C30 34, 38 34, 42 36 V12 C40 10, 30 10, 24 12 Z"/>
          <path d="M24 12 V36"/>
          <path d="M12 18 H20 M12 24 H20 M12 30 H18" stroke-linecap="round"/>
          <path d="M28 18 H36 M28 24 H36 M30 30 H36" stroke-linecap="round"/>
        </svg>
        <!-- Graduation cap -->
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20 L24 10 L44 20 L24 30 Z" stroke-linejoin="round"/>
          <path d="M12 24 V34 C12 34, 18 38, 24 38 C30 38, 36 34, 36 34 V24"/>
          <path d="M44 20 V30" stroke-linecap="round"/>
          <circle cx="44" cy="32" r="2" fill="#d4af37" stroke="none"/>
        </svg>
        <!-- Apple -->
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 14 C24 14, 22 8, 28 6 C28 12, 24 14, 24 14 Z" fill="#d4af37" stroke="none"/>
          <path d="M24 16 C16 16, 10 22, 10 30 C10 38, 16 44, 24 44 C32 44, 38 38, 38 30 C38 22, 32 16, 24 16 Z"/>
          <path d="M24 16 C22 20, 22 24, 24 24" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="date">
        <span class="star">✦</span>
        <span>5th September</span>
        <span class="star">✦</span>
      </div>
      <div class="bottom-rule" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
